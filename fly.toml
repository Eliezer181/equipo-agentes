# fly.toml app configuration file generated for equipo-agentes on 2026-09-13T00:23:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'equipo-agentes'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
