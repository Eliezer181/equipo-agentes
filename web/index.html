<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Equipo</title>
  <link rel="stylesheet" href="/static/styles.css?v=15" />
  <style>
    .palette button{width:28px;height:28px;border-radius:50%;border:2px solid #111;padding:0;background:none;color:transparent}
    .palette button.on{outline:2px solid #fff}
    .buddy{overflow:visible}
    .chat-who{flex:1;min-width:0}
    #btn-agent-menu{margin-left:auto;flex-shrink:0;width:36px;height:36px;border:0;border-radius:50%;background:#1c1c1e;color:#f4f4f5;z-index:3;position:relative}
    .modal{z-index:40}
    .switch{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#f4f4f5;font-size:14px}
    .stack-actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}
    .stack-actions button{width:100%}
    .msg-img{display:block;max-width:100%;border-radius:12px;margin:8px 0 4px}
    .msg-link,.mention{color:#93c5fd}
    .mention{font-weight:600}
    .add-one,.mention-row{display:flex;align-items:center;gap:8px;width:100%;border:0;background:#1c1c1e;color:#f4f4f5;border-radius:10px;padding:8px 10px;text-align:left}
    #add-member-list{display:flex;flex-direction:column;gap:6px}
    .bubble.assistant{position:relative;padding-right:34px}
    .reply-hit{position:absolute;top:8px;right:6px;width:28px;height:28px;border:0;border-radius:50%;background:#2c2c2e;color:#d4d4d8}
    .reply-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#121214;border-top:1px solid #1c1c1e}
    .reply-bar.hidden,.mention-box.hidden{display:none!important}
    .reply-copy{min-width:0;flex:1}
    .reply-copy b{display:block;font-size:12px;color:#93c5fd}
    .reply-copy span{display:block;font-size:12px;color:#8e8e93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mention-box{background:#121214;border-top:1px solid #1c1c1e;padding:6px;display:flex;flex-direction:column;gap:4px;max-height:160px;overflow:auto}
    .quote{font-size:11px;color:#93c5fd;margin-bottom:4px}
    .bubble.swipeable{transition:transform .12s ease}
  </style>
</head>
<body>
  <div id="app">
    <section id="inbox" class="screen active">
      <header class="top">
        <div class="avatar-me" aria-hidden="true"></div>
        <div class="top-actions">
          <button type="button" id="btn-search" title="Buscar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
          <button type="button" id="btn-add-group" title="Nuevo grupo">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </button>
          <button type="button" id="btn-add" title="Nuevo especialista">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </header>
      <input id="search" class="search hidden" placeholder="Buscar" />
      <div id="list" class="list"></div>
    </section>
    <section id="chat" class="screen">
      <header class="top chat-top">
        <button type="button" id="btn-back" class="back">←</button>
        <button type="button" id="chat-who" class="chat-who">
          <div id="chat-dot" class="buddy-slot"></div>
          <div class="who-text">
            <div id="chat-name" class="name"></div>
            <div id="chat-title" class="meta"></div>
          </div>
        </button>
        <button type="button" id="btn-agent-menu" title="Opciones">⋮</button>
      </header>
      <div id="thread" class="thread"></div>
      <form id="composer" class="composer">
        <input id="input" autocomplete="off" placeholder="Mensaje" enterkeyhint="send" />
        <button type="submit">Enviar</button>
      </form>
    </section>
    <div id="modal" class="modal hidden">
      <form id="create" class="sheet">
        <div class="grabber"></div>
        <h2>Nuevo agente</h2>
        <label>Nombre<input name="name" required maxlength="40" placeholder="Ej. Investigador" /></label>
        <label>Cargo<input name="title" maxlength="40" placeholder="Ej. Research" /></label>
        <label>Color del casco
          <input type="hidden" name="color" id="color-input" />
          <div id="color-palette" class="palette"></div>
        </label>
        <label>Cómo trabaja<textarea name="instructions" rows="4" placeholder="Rol, tono, límites."></textarea></label>
        <p class="hint-inline">Si no elegís color, se usa uno que nadie más tenga.</p>
        <div class="sheet-actions">
          <button type="button" id="btn-cancel" class="ghost">Cancelar</button>
          <button type="submit">Crear</button>
        </div>
      </form>
    </div>
    <div id="group-modal" class="modal hidden">
      <form id="create-group" class="sheet">
        <div class="grabber"></div>
        <h2>Nuevo grupo</h2>
        <label>Nombre<input name="name" required maxlength="60" placeholder="Ej. Lanzamiento" /></label>
        <label>Objetivo<textarea name="task" rows="3" placeholder="Qué tiene que resolver el equipo."></textarea></label>
        <label>Tu nombre (líder)<input name="leader" maxlength="60" placeholder="Renzo" /></label>
        <label>Integrantes<div id="group-members" class="members-list"></div></label>
        <div class="sheet-actions">
          <button type="button" id="btn-cancel-group" class="ghost">Cancelar</button>
          <button type="submit">Crear</button>
        </div>
      </form>
    </div>
    <div id="info-modal" class="modal hidden">
      <div class="sheet">
        <div class="grabber"></div>
        <h2 id="info-name">Grupo</h2>
        <p id="info-task" class="info-task"></p>
        <p class="section-label" style="padding-left:0">Integrantes</p>
        <div id="info-members" class="info-members"></div>
        <p class="section-label" style="padding-left:0">Agregar integrante</p>
        <div id="add-member-list"></div>
        <div class="sheet-actions">
          <button type="button" id="btn-close-info" class="ghost">Cerrar</button>
          <button type="button" id="btn-delete-group" class="danger">Borrar grupo</button>
        </div>
      </div>
    </div>
    <div id="agent-modal" class="modal hidden">
      <form id="edit-agent" class="sheet">
        <div class="grabber"></div>
        <h2>Agente</h2>
        <label>Nombre<input id="edit-name" required maxlength="40" /></label>
        <label>Rol / cargo<input id="edit-title" maxlength="40" /></label>
        <label>Color
          <input type="hidden" id="edit-color" />
          <div id="edit-palette" class="palette"></div>
        </label>
        <label>Cómo trabaja<textarea id="edit-instructions" rows="4"></textarea></label>
        <label class="switch">Avisarme cuando responde<input type="checkbox" id="notify-toggle" /></label>
        <div class="stack-actions">
          <button type="submit">Guardar cambios</button>
          <button type="button" id="btn-clear-chat" class="ghost">Vaciar chat</button>
          <button type="button" id="btn-archive" class="ghost">Archivar</button>
          <button type="button" id="btn-delete-agent" class="danger">Eliminar agente</button>
          <button type="button" id="btn-close-agent" class="ghost">Cerrar</button>
        </div>
      </form>
    </div>
  </div>
  <script src="/static/avatar.js?v=15"></script>
  <script src="/static/app.js?v=15"></script>
  <script src="/static/color-ui.js?v=15"></script>
  <script src="/static/media-ui.js?v=15"></script>
  <script src="/static/reply-ui.js?v=15"></script>
</body>
</html>
