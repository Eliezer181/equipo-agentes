<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Equipo</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="app">
    <section id="inbox" class="screen active">
      <header class="top">
        <div class="avatar-me" aria-hidden="true"></div>
        <div class="top-actions">
          <button type="button" id="btn-search" title="Buscar">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
          <button type="button" id="btn-add" title="Nuevo especialista">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </header>
      <input id="search" class="search hidden" placeholder="Buscar especialista" />
      <div id="list" class="list"></div>
    </section>

    <section id="chat" class="screen">
      <header class="top chat-top">
        <button type="button" id="btn-back" class="back">←</button>
        <div class="chat-who">
          <div id="chat-dot" class="dot"></div>
          <div>
            <div id="chat-name" class="name"></div>
            <div id="chat-title" class="meta"></div>
          </div>
        </div>
      </header>
      <div id="thread" class="thread"></div>
      <form id="composer" class="composer">
        <input id="input" autocomplete="off" placeholder="Mensaje" />
        <button type="submit">Enviar</button>
      </form>
    </section>
  </div>

  <div id="modal" class="modal hidden">
    <form id="create" class="sheet">
      <h2>Nuevo especialista</h2>
      <label>Nombre<input name="name" required maxlength="40" placeholder="Ej. Investigador" /></label>
      <label>Cargo<input name="title" maxlength="40" placeholder="Ej. Especialista en research" /></label>
      <label>Cómo debe trabajar<textarea name="instructions" rows="5" placeholder="Rol, tono, qué puede y qué no puede hacer."></textarea></label>
      <div class="sheet-actions">
        <button type="button" id="btn-cancel" class="ghost">Cancelar</button>
        <button type="submit">Crear</button>
      </div>
    </form>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
