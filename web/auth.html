<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050506" />
  <title>Cuenta · Equipo</title>
  <link rel="stylesheet" href="/static/marketing.css?v=1" />
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="logo" href="/landing">Equipo</a>
      <a class="ghost" href="/landing">Volver</a>
    </nav>

    <div class="auth-card" id="register-card">
      <h1>Creá tu cuenta</h1>
      <p class="sub">Acceso freemium. Sin tarjeta.</p>
      <form id="register-form">
        <label>Email<input name="email" type="email" required autocomplete="email" placeholder="tu@email.com" /></label>
        <label>Contraseña<input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres" /></label>
        <label>Confirmá contraseña<input name="password2" type="password" required minlength="8" autocomplete="new-password" /></label>
        <button class="btn btn-primary" type="submit">Registrarme</button>
        <p id="reg-msg" class="msg hidden"></p>
      </form>
      <p class="auth-foot">¿Ya tenés cuenta? <a href="/login">Iniciar sesión</a></p>
    </div>

    <div class="auth-card hidden" id="login-card">
      <h1>Iniciar sesión</h1>
      <p class="sub">Entrá a tu equipo de agentes.</p>
      <form id="login-form">
        <label>Email<input name="email" type="email" required autocomplete="email" /></label>
        <label>Contraseña<input name="password" type="password" required autocomplete="current-password" /></label>
        <button class="btn btn-primary" type="submit">Entrar</button>
        <p id="login-msg" class="msg hidden"></p>
      </form>
      <p class="auth-foot">¿No tenés cuenta? <a href="/registro">Crear cuenta gratis</a></p>
    </div>
  </div>
  <script src="/static/auth.js?v=1"></script>
</body>
</html>
